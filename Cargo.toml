[package]
name = "agent-memory-mcp"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Shared long-term memory for coding agents, served over MCP and backed by MongoDB"
repository = "https://github.com/opsnlops/agent-memory-mcp"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
mongodb = "3.10.1"
rmcp = { version = "3.9.0", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = "0.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false }
rmcp = { version = "3.9.0", features = ["client", "transport-streamable-http-client-reqwest"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
